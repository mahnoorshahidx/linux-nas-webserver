spring.application.name=nas-backend

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/nas_database
spring.datasource.username=nas_user
spring.datasource.password=${NAS_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# NAS file storage
nas.storage.path=uploads

# File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Backup storage location
nas.backup.path=backups

# Automatic backup scheduling
nas.backup.interval-ms=86400000
