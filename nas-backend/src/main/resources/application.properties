spring.application.name=nas-backend

# MySQL Database Configurations
spring.datasource.url=${NAS_DB_URL:jdbc:mysql://localhost:3306/nas_database}
spring.datasource.username=${NAS_DB_USERNAME:nas_user}
spring.datasource.password=${NAS_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# NAS Admin Configurations
nas.admin.username=${NAS_ADMIN_USERNAME:}
nas.admin.email=${NAS_ADMIN_EMAIL:}
nas.admin.password=${NAS_ADMIN_PASSWORD:}

# NAS file storage
nas.storage.path=${NAS_STORAGE_PATH:uploads}

# File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Backup storage location
nas.backup.path=${NAS_BACKUP_PATH:backups}
nas.backup.interval-ms=${NAS_BACKUP_INTERVAL_MS:86400000}

# Explicit server-approved config paths (set on Ubuntu, not your Mac)
# Example: NAS_CONFIG_BACKUP_SOURCES=apache=/etc/apache2/sites-available,ufw=/etc/ufw
nas.config-backup.sources=${NAS_CONFIG_BACKUP_SOURCES:}
nas.config-backup.path=${NAS_CONFIG_BACKUP_PATH:config-backups}
nas.config-backup.stage-path=${NAS_CONFIG_STAGE_PATH:config-restore-staging}
